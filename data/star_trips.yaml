# 피플레이와 함께한 스타 — 여행과 연예가 실제로 만난 기록
#
# 사장님 지시(2026-09-25): "플레이를 통해 다녀온 연예인들도 같이 넣어두면 좋을 것 같아."
# 괌플레이·사이판플레이 등 피플레이의 여행에 함께한 분들을 여기에 적으면
# /ent/startrip/ (스타의 여행) 지면 위에 표로 실린다.
#
# ★ 아직 비어 있다. 클로드는 이 명단을 알지 못하고, 지어내지 않는다.
#   저장소 어디에도 명단이 없었다(2026-09-25 확인). 사장님이 채운다.
#
# ★ consent 가 true 인 항목만 지면에 나간다.
#   연예인의 이름을 상업 매체(운영사가 여행사)가 쓰는 것은 초상권·퍼블리시티권
#   문제라 본인 또는 소속사의 **서면 동의**가 먼저다. 동의 없이 넣으면 나가지 않는다.
#   사진은 우리가 직접 찍었고 얼굴이 나오면 별도 동의를 받은 것만 photo 에 적는다.
#
# 항목 형식 (한 사람·한 여행에 한 항목):
#   - name: 활동명                 # 필수
#     group: 소속 그룹·대표 작품     # 선택
#     agency: 소속사                # 선택. 동의를 준 곳
#     region: guam                  # 여행지. models.REGIONS 의 키 (guam, saipan, hawaii, vietnam, kota, laos, jeju, japan, thailand, taiwan)
#     place: 투몬                   # 도시·장소
#     when: 2026-03                 # 시기 (YYYY-MM)
#     play: 괌플레이                # 함께한 플레이 브랜드
#     purpose: 화보 촬영            # 화보·예능 촬영·팬미팅·휴가·공연 등
#     consent: false                # 본인·소속사 서면 동의를 받았는가. true 여야 실린다
#     consent_note: 2026-03-02 ○○엔터 서면   # 동의 근거 메모 (지면에 안 나감)
#     article: /ent/xxxxxxxx-슬러그/  # 관련 기사 경로. 기사를 쓴 뒤 채운다
#     photo: ""                     # 직접 촬영 사진 웹 경로. 얼굴이 나오면 동의 필요
entries: []
