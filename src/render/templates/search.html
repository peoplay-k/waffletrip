{% extends "base.html" %}
{% block title %}기사 검색 — {{ site_name }}{% endblock %}
{% block description %}{{ site_name }} 기사 검색{% endblock %}
{% block content %}
<h1>기사 검색</h1>
<p class="lead-note">최근 14일치 기사 제목에서 찾습니다. 서버로 아무것도 보내지 않고
브라우저 안에서만 찾습니다.</p>

<form class="searchbox" onsubmit="return false">
  <label class="sr" for="q">검색어</label>
  <input id="q" type="search" placeholder="예: 괌 항공, 태풍, 환율" autocomplete="off" autofocus>
</form>

<p id="count" class="note"></p>
<div id="hits" class="hitlist"></div>
<noscript><p class="note">검색에는 자바스크립트가 필요합니다. 지역면에서 직접 찾아보실 수 있습니다.</p></noscript>

<script>
(function () {
  var q = document.getElementById('q'),
      hits = document.getElementById('hits'),
      count = document.getElementById('count'),
      data = null;

  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function draw(list, term) {
    if (!term) { hits.innerHTML = ''; count.textContent = ''; return; }
    count.textContent = list.length + '건';
    if (!list.length) { hits.innerHTML = '<p class="note">찾는 기사가 없습니다.</p>'; return; }
    hits.innerHTML = list.slice(0, 60).map(function (it) {
      return '<article class="hit">' +
        '<a class="rg" href="/' + esc(it.k) + '/">' + esc(it.r) + '</a>' +
        '<h3><a href="' + esc(it.u) + '">' + esc(it.t) + '</a></h3>' +
        '<div class="byline">' + esc(it.d) + '</div></article>';
    }).join('');
  }

  function run() {
    var term = q.value.trim().toLowerCase();
    if (!data) return;
    // 공백으로 나눈 낱말이 모두 들어 있어야 한다. 사람은 보통 그렇게 기대한다.
    var words = term.split(/\s+/).filter(Boolean);
    draw(!words.length ? [] : data.filter(function (it) {
      var hay = (it.t + ' ' + it.r).toLowerCase();
      return words.every(function (w) { return hay.indexOf(w) >= 0; });
    }), term);
  }

  fetch('/search.json').then(function (r) { return r.json(); })
    .then(function (j) { data = j; run(); })
    .catch(function () { count.textContent = '색인을 불러오지 못했습니다.'; });

  q.addEventListener('input', run);
})();
</script>
{% endblock %}
