# 방문 분석·검색 노출 설정
#
# 여기에 값을 넣으면 사이트에 스크립트가 붙고, **개인정보처리방침 문구도
# 함께 바뀐다.** 둘을 따로 관리하면 반드시 어긋난다 — 실제로 "추적기를
# 심지 않습니다"라고 써둔 채 추적기를 붙이는 사고가 가장 흔하다.
#
# 값을 비워두면 아무것도 붙지 않고 방침도 "수집하지 않습니다"로 남는다.

# ── 방문 분석 ────────────────────────────────────────────────
# 둘 중 하나만 쓴다. 둘 다 넣으면 둘 다 붙는다(권장하지 않음).
#
# ga4: 구글 애널리틱스 4. 유입경로·검색어·체류시간까지 가장 자세하다.
#      광고주가 자료를 요구하면 보통 이걸 본다. 쿠키를 쓴다.
#      analytics.google.com 에서 만들고 "G-" 로 시작하는 측정 ID 를 넣는다.
ga4: ""

# cloudflare: 쿠키를 쓰지 않는 가벼운 분석. 개인정보를 모으지 않는다.
#             dash.cloudflare.com → Web Analytics 에서 토큰을 받는다.
cloudflare: ""

# ── 검색 노출 ────────────────────────────────────────────────
# 소유 확인용 문자열. 등록만 하면 검색어·노출수·클릭수를 볼 수 있다.
# search.google.com/search-console 에서 HTML 태그 방식 선택 후 content 값만
google_site_verification: ""

# searchadvisor.naver.com 에서 받은 값. 국내 검색 유입에는 이쪽이 더 중요하다.
naver_site_verification: ""
