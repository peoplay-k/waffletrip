# 피플로드 편집실 설정
#
# 사진은 **대표 사진 한 장**을 여기서 올릴 수 있다(2026-09-16 사장님 결정).
# 올린 원본은 content/uploads/ 에 잠시 머물고, 발행 파이프라인의 '사진 반입'
# (tools/photo_intake.py)이 얼굴·사람을 검사해 통과분만 assets/photos/ 로 굽는다.
# 차단되면 photo_note 에 사유가 적히고 지면에는 안 나간다. 원본은 어느 쪽이든 지운다 —
# 다만 공개 저장소라 이력에는 남는다(사장님이 감수한 부분).
# 여행 기사에 사진을 안 올리면 지역 사진이 자동 배정된다. 연예 기사에는 자동 배정이 없다.

backend:
  name: github
  repo: peoplay-k/waffletrip
  branch: main
  # 로그인은 GitHub 개인 액세스 토큰으로 한다(Sveltia CMS, 2026-10-28). 로그인을 중개할
  # 서버(base_url)는 두지 않는다 — 세우지 못해 예전 편집실은 로그인이 한 번도 안 됐다.
  # 토큰 만드는 법: docs/ADMIN.md

# 화면 언어는 브라우저 언어(한국어)를 따른다. 로컬 저장소로 일하려면 로그인 화면의
# 'Work with Local Repository'(크롬·엣지)로 저장소 폴더를 고른다.
publish_mode: simple
media_folder: content/uploads
public_folder: /content/uploads

collections:
  - name: articles
    label: 기사
    label_singular: 기사
    folder: content/review
    create: true
    slug: "{{year}}{{month}}{{day}}_{{slug}}"
    identifier_field: title
    # 목록 한 줄. 제목을 앞에 둔다 — 상태 설명이 길어 제목이 밀려났다(2026-10-30 사장님 화면).
    summary: "{{title}}  ·  {{published_on}}"
    # 최신 기사가 위로. 발행 전 원고는 발행일이 없어 맨 아래로 간다 — 위 필터 '작성중'·'발행대기'로 본다.
    sortable_fields:
      fields: [published_on, title, region, category, status]
      default:
        field: published_on
        direction: descending
    view_filters:
      - { label: 작성중, field: status, pattern: draft }
      - { label: 발행대기, field: status, pattern: approved }
      - { label: 발행됨, field: status, pattern: published }
      - { label: 여행, field: channel, pattern: travel }
      - { label: 문화, field: channel, pattern: ent }
    fields:
      - label: 제목
        name: title
        widget: string
        hint: 지면에 그대로 나갑니다. 어절 단위로 끊어 읽히게 씁니다.

      - label: 채널
        name: channel
        widget: select
        default: travel
        options:
          - { label: 여행 — 지역면에 실립니다, value: travel }
          - { label: 문화 — /ent/ 부문에 실립니다, value: ent }
        hint: 문화를 고르면 아래 '지역면'은 무시되고 '문화 부문'이 지면이 됩니다.

      - label: 지역면
        name: region
        widget: select
        required: false
        options:
          - { label: 괌, value: guam }
          - { label: 사이판, value: saipan }
          - { label: 하와이, value: hawaii }
          - { label: 베트남, value: vietnam }
          - { label: 코타키나발루, value: kota }
          - { label: 라오스, value: laos }
          - { label: 제주, value: jeju }
          - { label: 일본, value: japan }
          - { label: 태국, value: thailand }
          - { label: 대만, value: taiwan }
          - { label: 국내, value: korea }
          - { label: 여행업계, value: industry }
        hint: 여행 기사는 반드시 고릅니다. 문화 기사는 아무거나 두어도 무시됩니다.

      - label: 문화 부문
        name: category
        widget: select
        required: false
        options:
          - { label: 영화, value: movie }
          - { label: 방송·드라마 (드라마·예능·오늘 방송 회차), value: tv }
          - { label: 음악, value: music }
          - { label: 공연·전시 (뮤지컬·연극·클래식·전시), value: stage }
          - { label: 스타의 여행 (인물·촬영지·해외 공연), value: startrip }
        hint: 문화 기사만 씁니다. 비우면 제목으로 추정하고, 모르면 스타의 여행으로 갑니다.

      - label: 부문
        name: section
        widget: select
        default: news
        options:
          - { label: 일반 소식·해설, value: news }
          - { label: 항공·노선, value: flight }
          - { label: 데이터·통계, value: data }
          - { label: 안내, value: promo }

      - label: 요약
        name: summary
        widget: text
        required: false
        hint: 목록과 검색 결과, 카톡 공유 카드에 나옵니다. 한두 문장.

      - label: 필자
        name: source_name
        widget: select
        required: false
        default: ""
        options:
          - { label: "자동 — 그 지면 담당 기자", value: "" }
          - { label: 김태성 기자, value: 김태성 }
          - { label: 이병훈 기자, value: 이병훈 }
          - { label: 이우재 기자, value: 이우재 }
          - { label: 장미화 기자, value: 장미화 }
          - { label: 이승훈 기자, value: 이승훈 }
          - { label: 한수비 기자, value: 한수비 }
        hint: >-
          비워두면 그 지면 담당 기자 이름이 붙습니다(매체 소개의 편집국 표).
          명부에 있는 사람만 고를 수 있습니다. 기자를 늘리려면 src/desks.py 의 REPORTERS.

      - label: 기사 종류
        name: kind
        widget: select
        required: false
        default: 취재
        options:
          - { label: 취재, value: 취재 }
          - { label: 기획, value: 기획 }
          - { label: 인터뷰, value: 인터뷰 }
          - { label: 해설, value: 해설 }
          - { label: 보도자료, value: 보도자료 }
        hint: >-
          취재·기획·인터뷰가 자체 기사입니다. 네이버 제휴 심사는 자체 기사 비중을
          봅니다(편집국장: 50% 이상). 보도자료를 다시 쓴 것은 '보도자료',
          여러 매체 보도를 묶어 정리한 것은 '해설'.

      - label: 원문 링크
        name: source_url
        widget: string
        required: false
        hint: 다른 매체 보도나 보도자료를 정리한 경우에만 넣습니다.

      - label: 상태
        name: status
        widget: select
        default: draft
        options:
          - { label: 작성중, value: draft }
          - { label: 발행대기, value: approved }
          - { label: 발행됨, value: published }
        hint: >-
          작성중은 지면에 안 나갑니다. 발행대기로 저장하면 10분 안팎에 나갑니다.
          발행됨 기사를 고쳐 저장하면 10분 안팎에 지면도 바뀝니다.

      - label: 대표 사진
        name: photo
        widget: image
        required: false
        hint: >-
          직접 찍은 사진만. 얼굴이 보이면 지면에 안 나갑니다(자동 검사).
          공개 저장소라 올린 원본은 지워도 이력에 남습니다. 본문 안 이미지는 받지 않습니다.
          연예인 사진은 본인·소속사 동의가 있을 때만.

      - label: 1면용 풍경 사진
        name: photo_hero
        widget: boolean
        default: false
        required: false
        hint: 사람 없는 풍경이면 켭니다. 1면과 지역면 톱에 우선 쓰입니다.

      - label: 사진 검사 결과
        name: photo_note
        widget: string
        required: false
        hint: 발행 파이프라인이 적습니다. 손대지 않습니다. "얼굴 2건 검출 — 지면에 싣지 않았다" 처럼.

      # 발행 파이프라인이 쓰는 칸. 화면에는 안 보이지만 저장할 때 지우면 안 된다 —
      # published_id 가 없어지면 고친 내용이 지면에 안 옮겨지고(src/sync_edits.py),
      # sources 가 없어지면 같은 근거로 두 번 내는 것을 못 막는다.
      - { label: 원고 id, name: id, widget: hidden }
      - { label: 발행 id, name: published_id, widget: hidden }
      - { label: 발행일, name: published_on, widget: hidden }
      - { label: 근거 주소, name: sources, widget: hidden }
      - { label: 보류 사유, name: reason, widget: hidden }
      - { label: 중복 원고, name: duplicate_of, widget: hidden }

      - label: 본문
        name: body
        widget: markdown
        hint: >-
          신문 기사 형식(2026-10-28): 요약 문단 → 발표 문단("○○는 N일 …했다고 밝혔다") →
          세부 문단 → 관계자 말. 소제목·목록·표·굵은 글씨·"알아둘 점"은 쓰지 않습니다.
          매체 이름("○○ 보도에 따르면")은 본문에 쓰지 않습니다. 상품 링크·전화번호도 넣지 않습니다.
