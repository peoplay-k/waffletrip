<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>피플로드 편집실</title>
<!-- 편집실 입구(2026-10-30). 편집실은 별도 서버(Cloudflare Worker, 저장소 admin/)에서 돈다 —
     아이디·비밀번호 로그인, 기사·카테고리·지역·기자·홈 배치. 이 쪽은 그 주소로 넘기기만 한다.
     주소는 배포(.github/workflows/admin.yml)가 아래 EDITOR_URL 에 적는다. 손으로 고치지 않는다. -->
<style>
  :root{--ink:#0E0E0F;--muted:#6E6E73;--bg:#fff}
  @media (prefers-color-scheme: dark){:root{--ink:#F2F2F0;--muted:#A0A0A6;--bg:#0C0C0D}}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",sans-serif;word-break:keep-all}
  main{max-width:560px;margin:0 auto;padding:64px 20px}
  h1{font-size:26px;letter-spacing:-.04em;margin:0 0 10px}
  p{color:var(--muted);margin:0 0 10px}
  a{color:var(--ink);font-weight:700}
</style>
<script>
var EDITOR_URL = "";
if (EDITOR_URL) location.replace(EDITOR_URL);
</script>
</head>
<body>
<main>
  <h1>피플로드 편집실</h1>
  <p id="msg">편집실을 설치하는 중입니다. 설치가 끝나면 이 주소에서 바로 로그인 화면으로 넘어갑니다.</p>
</main>
<script>
if (EDITOR_URL) document.getElementById("msg").innerHTML = '편집실로 넘어갑니다. 넘어가지 않으면 <a href="' + EDITOR_URL + '">여기</a>를 누르세요.';
</script>
</body>
</html>
