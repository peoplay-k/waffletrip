  # ── Google 뉴스 검색 피드 ──────────────────────────────────────
  # 일본·태국·대만에는 우리가 붙일 현지 소스가 없다. 국내 여행 전문지도
  # RSS 로 하루 열 건 남짓만 준다. 그래서 신디케이션용으로 공개된 Google
  # 뉴스 검색 피드를 쓴다. 질의를 "여행"만으로 두면 연예인 근황이 섞여
  # 들어와 (항공 OR 노선 OR 관광 OR 호텔)로 좁혔다.
