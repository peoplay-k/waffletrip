  # guam_post (The Guam Daily Post): robots 허용, RSS 링크도 정상이지만 조사 내내(2회
  # 공식 실행 + 수동 재시도 다수, 약 40분에 걸쳐) HTTP 429만 반환. 죽은 게 아니라 우리
  # 조사 트래픽이 레이트리밋을 건드렸을 가능성이 높음 — 시간을 두고 단독 재조사 필요.
  # 2026-09-09 재조사: 단독 요청은 200·30건. 부고가 많지만 여행 필터가 거른다. 다시 켠다.
  - id: guam_post
    region: guam
    section: news
    name: The Guam Daily Post
    type: rss
    url: https://www.postguam.com/search/?f=rss&t=article&l=30&s=start_time&sd=desc
    lang: en
    enabled: true

  # guam_kuam (KUAM News): React/SPA — 정적 HTML 어디에도 RSS 없음, 흔한 경로 전부
  # 앱 셸 HTML 200 반환.
  - id: guam_kuam
    region: guam
    section: news
    name: KUAM News
    type: rss
    url: https://www.kuam.com/feed
    lang: en
    enabled: false

  # guam_pdn (Pacific Daily News): postguam.com과 동일 TNCMS 플랫폼, RSS 구조 자체는
  # 정상이지만 "#topstory" 키워드 태그에 현재 걸리는 기사가 0건 (RSS 항목 0개).
  # 2026-09-09 재조사: #topstory 태그를 빼면 30건 정상. robots(*)는 /search 를 막지 않는다. 다시 켠다.
  - id: guam_pdn
    region: guam
    section: news
    name: Pacific Daily News
    type: rss
    url: https://www.guampdn.com/search/?f=rss&t=article&l=30&s=start_time&sd=desc
    lang: en
    enabled: true

  # guam_visitguam (Guam Visitors Bureau): RSS 링크 태그 없음, 흔한 경로(/feed/, /rss,
  # /?feed=rss2 등) 전부 404 또는 홈페이지로 리다이렉트. RSS 자체가 없는 것으로 판단.
  - id: guam_visitguam
    region: guam
    section: news
    name: Guam Visitors Bureau
    type: rss
    url: https://www.visitguam.com/feed/
    lang: en
    enabled: false

  # ============ saipan ============

  # saipan_tribune: RSS는 정상이지만(WordPress, /index.php/feed/) 서버가 매우 불안정
  # 하다 — 이번 조사에서 성공 2회, 완전 타임아웃 4회를 관측했다(10~25초 범위에서 혼재).
  # 이번 최종 실행(check_sources.py, 10초 타임아웃)에서는 성공(10건)해서 살려뒀지만
  # 수집 파이프라인에서 실패를 정상 상황으로 다뤄야 한다. 상세: source-survey 문서.
