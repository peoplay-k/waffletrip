# 와플트립 소스 레지스트리
# type: rss | json
# section: flight | news | data | promo
# region: guam | saipan | hawaii | vietnam | kota | laos | jeju | all | auto
#   auto = 기사 내용에서 지역을 추론한다 (지역 추론기는 Task 2 에서 구현, src/region_tag.py).
#          국내 여행 전문 매체처럼 여러 지역이 섞인 피드에 쓴다.
# 죽은 소스는 지우지 말고 enabled: false 로 남긴다 (재조사 방지) — 이 규칙을 실제로 지킨다:
#   탈락·보류 후보도 전부 아래 항목으로 등록하고 사유를 한 줄 주석으로 남긴다.
#
# 실측 조사 전체 기록: docs/source-survey-2026-08-31.md (판정표·robots.txt 원문·재시도 이력)

sources:
  - id: exchange_rate
    region: all
    section: data
    name: 환율
    type: json
    url: https://open.er-api.com/v6/latest/KRW
    lang: en
    enabled: true

  # 날씨. 인증키가 필요 없는 Open-Meteo 를 쓴다. 공공데이터포털 키를 기다리느라
  # A등급이 환율 하나로 남아 있던 것을 메운다.
  # 좌표 순서는 src/fetch/json_api.py 의 WEATHER_SITES 와 같지만, 파서는 순서가
  # 아니라 응답 좌표로 지역을 되찾으므로 이 URL 을 고쳐도 지역이 뒤바뀌지 않는다.
  - id: weather
    region: all
    section: data
    name: 날씨
    type: json
    url: https://api.open-meteo.com/v1/forecast?latitude=13.4443,15.1850,21.3069,16.0544,5.9804,17.9757,33.4996&longitude=144.7937,145.7467,-157.8583,108.2022,116.0735,102.6331,126.5312&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=auto&forecast_days=1
    lang: en
    enabled: true

  # ============ guam ============

  - id: guam_pacific_island_times
    region: guam
    section: news
    name: Pacific Island Times
    type: rss
    url: https://www.pacificislandtimes.com/blog-feed.xml
    lang: en
    enabled: true

  # guam_post (The Guam Daily Post): robots 허용, RSS 링크도 정상이지만 조사 내내(2회
  # 공식 실행 + 수동 재시도 다수, 약 40분에 걸쳐) HTTP 429만 반환. 죽은 게 아니라 우리
  # 조사 트래픽이 레이트리밋을 건드렸을 가능성이 높음 — 시간을 두고 단독 재조사 필요.
  - id: guam_post
    region: guam
    section: news
    name: The Guam Daily Post
    type: rss
    url: https://www.postguam.com/search/?f=rss&t=article&l=50&s=start_time&sd=desc&k%5B%5D=%23topstory
    lang: en
    enabled: false

  # guam_kuam (KUAM News): React/SPA — 정적 HTML 어디에도 RSS 없음, 흔한 경로 전부
  # 앱 셸 HTML 200 반환.
  - id: guam_kuam
    region: guam
    section: news
    name: KUAM News
    type: rss
    url: https://www.kuam.com/feed
    lang: en
    enabled: false

  # guam_pdn (Pacific Daily News): postguam.com과 동일 TNCMS 플랫폼, RSS 구조 자체는
  # 정상이지만 "#topstory" 키워드 태그에 현재 걸리는 기사가 0건 (RSS 항목 0개).
  - id: guam_pdn
    region: guam
    section: news
    name: Pacific Daily News
    type: rss
    url: https://www.guampdn.com/search/?f=rss&t=article&l=50&s=start_time&sd=desc&k%5B%5D=%23topstory
    lang: en
    enabled: false

  # guam_visitguam (Guam Visitors Bureau): RSS 링크 태그 없음, 흔한 경로(/feed/, /rss,
  # /?feed=rss2 등) 전부 404 또는 홈페이지로 리다이렉트. RSS 자체가 없는 것으로 판단.
  - id: guam_visitguam
    region: guam
    section: news
    name: Guam Visitors Bureau
    type: rss
    url: https://www.visitguam.com/feed/
    lang: en
    enabled: false

  # ============ saipan ============

  # saipan_tribune: RSS는 정상이지만(WordPress, /index.php/feed/) 서버가 매우 불안정
  # 하다 — 이번 조사에서 성공 2회, 완전 타임아웃 4회를 관측했다(10~25초 범위에서 혼재).
  # 이번 최종 실행(check_sources.py, 10초 타임아웃)에서는 성공(10건)해서 살려뒀지만
  # 수집 파이프라인에서 실패를 정상 상황으로 다뤄야 한다. 상세: source-survey 문서.
  - id: saipan_tribune
    region: saipan
    section: news
    name: Saipan Tribune
    type: rss
    url: https://www.saipantribune.com/index.php/feed/
    lang: en
    enabled: true

  # saipan_variety (Marianas Variety): robots.txt 가 `User-agent: * / Disallow: /` 로
  # 사이트 전체를 모든 크롤러에게 차단. RSS 자체는 postguam.com과 동일 CMS라 살아있을
  # 가능성이 높지만 robots 규칙상 시도하지 않는다.
  - id: saipan_variety
    region: saipan
    section: news
    name: Marianas Variety
    type: rss
    url: https://www.mvariety.com/search/?f=rss&t=article&l=50&s=start_time&sd=desc&k%5B%5D=%23topstory
    lang: en
    enabled: false

  # saipan_mva (Marianas Visitors Authority): httpx 연결 자체가 TLS 프로토콜 버전
  # 불일치로 실패(TLSV1_ALERT_PROTOCOL_VERSION). curl로는 접속되지만 /feed/ 등
  # 모든 흔한 경로가 홈페이지로 리다이렉트될 뿐 실제 RSS가 없음을 별도 확인함.
  - id: saipan_mva
    region: saipan
    section: news
    name: Marianas Visitors Authority
    type: rss
    url: https://www.mymarianas.com/feed/
    lang: en
    enabled: false

