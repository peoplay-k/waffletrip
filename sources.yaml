  # 아니었고 구글뉴스 국내 검색(gn_korea)에 우연히 걸린 것만 하루 2~3건 들어왔다(10-28 부터).
  # 문화 전문지라 여행면과 영화·공연·전시·방송면이 한 피드로 온다. 지명·여행 말이 있으면 여행,
  # 아니면 문화 발표인지 보고 문화 채널로(culture: true), 둘 다 아니면 버린다.
  # 피드 주소는 같은 CMS(/news/articleView.html?idxno=) 매체 8곳이 전부 쓰는 패턴이다 — 다만
  # 여기(클라우드)서는 네트워크가 막혀 실물 응답을 못 봤다. 첫 실행의 _errors.json 에서 확인한다.
