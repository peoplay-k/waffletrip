# 피플로드 소스 레지스트리 (옛 이름 와플트립)
# type: rss | json
# section: flight | news | data | promo
# region: guam | saipan | hawaii | vietnam | kota | laos | jeju | all | auto
#   auto = 기사 내용에서 지역을 추론한다 (지역 추론기는 Task 2 에서 구현, src/region_tag.py).
#          국내 여행 전문 매체처럼 여러 지역이 섞인 피드에 쓴다.
# 죽은 소스는 지우지 말고 enabled: false 로 남긴다 (재조사 방지) — 이 규칙을 실제로 지킨다:
#   탈락·보류 후보도 전부 아래 항목으로 등록하고 사유를 한 줄 주석으로 남긴다.
#
# 실측 조사 전체 기록: docs/source-survey-2026-08-31.md (판정표·robots.txt 원문·재시도 이력)

sources:
  - id: exchange_rate
    region: all
    section: data
    name: 환율
    type: json
    url: https://open.er-api.com/v6/latest/KRW
    lang: en
    enabled: true

  # 날씨. 인증키가 필요 없는 Open-Meteo 를 쓴다. 공공데이터포털 키를 기다리느라
  # A등급이 환율 하나로 남아 있던 것을 메운다.
  # 좌표 순서는 src/fetch/json_api.py 의 WEATHER_SITES 와 같지만, 파서는 순서가
  # 아니라 응답 좌표로 지역을 되찾으므로 이 URL 을 고쳐도 지역이 뒤바뀌지 않는다.
  - id: weather
    region: all
    section: data
    name: 날씨
    type: json
    url: https://api.open-meteo.com/v1/forecast?latitude=13.4443,15.1850,21.3069,16.0544,5.9804,17.9757,33.4996,34.6937,13.7563,25.0330&longitude=144.7937,145.7467,-157.8583,108.2022,116.0735,102.6331,126.5312,135.5023,100.5018,121.5654&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,weather_code&timezone=auto&forecast_days=1
    lang: en
    enabled: true

  # ============ guam ============

  - id: guam_pacific_island_times
    region: guam
    section: news
    name: Pacific Island Times
    type: rss
    url: https://www.pacificislandtimes.com/blog-feed.xml
