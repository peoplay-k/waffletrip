  # 2026-10-30 소스 확장. 사장님: "내가 말한 거기는 그냥 그런거고 너가 기사를 다 찾아서 넣어야지
  # 왜 3군데만 봐 다른곳도 다 봐" — TTL뉴스·문화뉴스·ㅍㅍㅅㅅ는 예였다. 여행 기사가 실제로 나오는
  # 곳을 전부 붙인다. 2주 실측(10-17~30)으로 본 지면 사정: 투어코리아 혼자 865건, 그다음이
  # 트래블데일리 119건이고 태국 9건·사이판 20건·라오스 21건·대만 26건이 전부였다. 태국·대만 검색
  # 피드는 질의가 "태국 방콕"처럼 두 낱말을 다 요구해서 거의 안 걸렸다(아래에서 고쳤다).
  #
  # 여기(클라우드)는 네트워크가 막혀 어느 주소도 실물 응답을 못 봤다. 주소는 전부 확립된 패턴이다 —
  #   · 국내 매체 중 기사 주소가 /news/articleView.html?idxno= 인 CMS(ndsoft) → /rss/allArticle.xml
  #   · 워드프레스 → /feed/
  #   · 자체 RSS 가 없거나 못 믿는 매체 → 구글뉴스 site: 검색 피드(원문 해결 단계가 실제 주소로 푼다)
  # 첫 실행 로그의 `실패 <id>` 줄을 보고 죽은 것을 끈다(지우지 않는다 — 맨 위 규칙).
  #
  # 설정 원칙
  #   · 여행 전문지(ndsoft 피드) → region: auto, curated: true (여행신문과 같다)
  #   · 종합지·통신사의 site: 검색 → region: auto, industry: false, curated: false
  #     제목에 지명이나 여행 말이 없으면 수집 단계가 버리고(src/fetch/rss.py), 편집 단계의
  #     여행 관련성·사건·스팸 필터를 그대로 지난다. 금융·교육청·지자체 보도자료는 못 들어온다.
  #   · 지역이 하나뿐인 현지 영문 매체 → 그 지역으로 고정, lang: en. 영문 제목은 해설 에이전트가
  #     우리말로 옮긴다(src/title_ko.py). 여행 전문이 아니면 curated 를 끈다.
  #   · 여러 나라를 다루는 영문 매체 → region: auto, industry: false — 우리 지역 이름이 제목에 있는
  #     기사만 남는다.
  # ════════════════════════════════════════════════════════════════════════════════

