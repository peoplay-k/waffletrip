  # 통째로 버렸는데 진짜 여행업계 기사도 같이 버려져 하루 1~6건만 남았다(2026-10-20~30 실측).
  # 2026-10-30 사장님: "여행 기사 더 만들어 … 여기 기사들 많은데 뭐하는거야? 좀 챙겨서 가지고와서
  # 좀 올려". 이제 지명이 아니라 여행 말로 가른다(src/fetch/rss.py) — 제목에 여행·항공·호텔·여행사
  # 말이 있으면 지명이 없어도 여행업계면으로 받고, 지명만 있는 증권·제약 보도자료는 버린다.
