name: 매일 발행

on:
  # 승인된 해설 초안이 올라오면 바로 낸다. 예약 시각까지 기다리면 오늘 쓴
  # 해설이 내일 아침에야 실린다. 봇이 GITHUB_TOKEN 으로 미는 커밋은
  # 깃허브가 재실행하지 않으므로 발행 기록 커밋으로 되돌지 않는다.
  push:
    paths:
      - 'content/review/**'
      - 'data/title_ko.json'   # 해설 에이전트가 번역을 밀면 바로 입힌다
  schedule:
    # 08:00 KST = 23:00 UTC (전일). GitHub 스케줄은 UTC 기준이다.
    # GitHub 은 부하가 몰리면 예약 시각보다 수 분에서 수십 분 늦게 띄운다.
    # 정각을 보장하지 않으므로 아침에 확인하는 용도로만 믿는다.
    - cron: '0 23 * * *'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 발행 이력 커밋
  pages: write              # Pages 배포
  id-token: write           # Pages 인증

concurrency:
  group: waffletrip-daily
  cancel-in-progress: false # 발행 중 취소는 이력만 어긋나게 만든다

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트
        run: python -m pytest -q

      - name: 수집
        run: python -m src.collect

      # Google 뉴스 리다이렉트를 실제 기사로 푼다 — 요약·매체명·발행시각.
      # 이게 없으면 기사 페이지가 제목 한 줄짜리 얇은 페이지가 된다.
      # 구글이 방식을 바꿔 실패해도 발행은 계속한다 — 요약 없는 기사는 색인에서 뺀다.
      - name: 원문 해결
        run: python -m src.fetch.resolve
        continue-on-error: true

      # 급상승 키워드. 해설 기사 후보 선정의 세 경로 중 하나라 편집 앞에 둔다.
      # 실패해도 죽지 않는다 — 키워드는 보조 신호다.
      - name: 급상승 키워드
        run: python -m src.trending

      - name: 편집
        run: python -m src.edit

      # 승인된 해설 초안을 내보낸다. edit 가 쓴 오늘자 jsonl 에 이어쓰므로
      # 반드시 편집 뒤, 빌드 앞이어야 한다.
      - name: 해설 발행
        run: python -m src.publish_drafts

      # 2026-09-06 waffletrip.com 연결. 이제 사이트가 도메인 루트에서
      # 서비스되므로 경로 접두사를 주지 않는다(src/render/site.py 기본값).
      # 오늘 쓸 기사거리를 묶는다. 해설 에이전트가 12:17 에 이걸 읽는다.
      # 사건·사고를 빼고, 우리말 기사를 앞에 두고, 같은 건을 쓴 매체끼리
      # 묶어 지역별로 정리한다. 이게 없으면 에이전트가 수집분 원본을
      # 처음부터 훑어야 해서 좋은 거리를 놓친다.
      - name: 기사거리 묶기
        run: python tools/story_material.py --days 2
        continue-on-error: true

      # ★ 빌드보다 **먼저** 만든다. 빌드가 static/video 를 public/video 로
      # 통째로 복사하므로, 빌드 뒤에 만들면 그날 영상은 사이트에 실리지
      # 않는다. 2026-09-15 까지 실제로 그랬다 — 홈 영상이 9월 6일에 손으로
      # 올린 파일에 아흐레 동안 멈춰 있었다.
      #
      # 무음이라 크레딧이 0원이다. 목소리가 없으므로 화면이 정보를 전부
      # 지고, 장면 길이를 말하는 속도가 아니라 **읽는 속도**로 잡는다.
      # 나레이션을 살지는 그대로 열려 있다(docs/P3-DECISIONS.md 15번).
      #
      # 한글 폰트가 없으면 네모만 그려진 화면이 나오므로 먼저 깐다.
      # 영상이 실패해도 신문은 나가야 하므로 여기서 멈추지 않는다. 대신
      # 건강검진이 사흘 묵으면 잡을 죽여 알림을 띄운다.
      - name: 영상 만들기
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python tools/make_longform.py --silent --out static/video \
                                        --frames video-frames
          # 대본은 저장소 루트에 남긴다. --frames 만 주면 public/video 로
          # 가는데 거기는 gitignore 라 다음 빌드가 지운다.
          python tools/make_longform.py --script-only

          # 숏폼(세로)도 하루 한 편. 홈에는 안 걸리고 인스타 릴스·유튜브
          # 쇼츠·틱톡으로 나갈 재고다. 날마다 돌려 한 곳만 계속 안 나가게 한다.
          #
          # ★사진이 넉넉한 곳만 돈다. 글자만 넘어가는 영상은 릴스가 아니다
          # (2026-09-15 사장님 지적). 일본·태국·대만은 자사 촬영본이 0장이라
          # 뺐고, 다낭도 2장뿐이라 뺐다. NAS 에서 더 캐면 그때 늘린다.
          # 순서는 유지하되(한 곳만 계속 나가지 않게) 그날 **만들 수 있는
          # 첫 곳**까지 내려간다. 고정으로 하면 그곳에 우리말 소식이 모자란
          # 날 아무것도 안 나온다 — 2026-09-16 실측 다섯 중 하나만 통과.
          #
          # 나레이션을 얹는다. 사장님 일레븐랩스 계정이 직접 붙어 있어
          # 크레딧이 들지 않는다(Creator 월 30만 자, 한 편 200자 안팎).
          # 키가 없으면 무음판으로 떨어진다 — 아예 안 나가는 것보다 낫다.
          ROTATE="guam saipan kota hanoi hawaii"
          if [ -n "$ELEVENLABS_API_KEY" ]; then
            python tools/make_shorts.py --rotate "$ROTATE" --voiced --out static/video
          else
            echo "일레븐랩스 키 없음 — 무음판으로 만든다"
            python tools/make_shorts.py --rotate "$ROTATE" --silent --out static/video
          fi
        continue-on-error: true

      # 화면 원본은 저장소에 넣지 않고 아티팩트로 내린다.
      # 하루 1.2MB 씩 쌓으면 저장소가 못 버틴다.
      - name: 빌드
        run: python -m src.build

      - name: 영상 화면 내려받기용
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-frames
          path: video-frames/
          retention-days: 30
          if-no-files-found: ignore

      # 조용한 실패를 잡는다. 이상하면 exit 1 로 죽어 Actions 실패 메일이 간다.
      # 빌드 뒤에 두는 이유 — 오늘치 사이트는 일단 내보내고 나서 경보를 울린다.
      # 오늘 쓴 해설이 약속대로 됐는지 본다. 원문 링크가 빠졌거나 너무
      # 짧으면 여기 찍힌다. 잡을 죽이지는 않는다 — 신문은 이미 나갔고,
      # 고칠 사람이 보라고 남기는 기록이다.
      - name: 해설 점검
        run: python tools/check_articles.py
        continue-on-error: true

      - name: 건강검진
        run: python -m src.health

      - name: 발행 이력 커밋
        run: |
          git config user.name  "waffletrip-bot"
          git config user.email "bot@waffletrip.com"
          # health.json 을 빼면 건강검진이 매일 돌고도 기록이 러너와 함께
          # 사라진다. '3일 연속 발행 0건' 같은 검사는 과거 기록이 있어야
          # 성립하므로, 빠뜨리면 검진 세 개 중 두 개가 꺼진 것과 같다.
          git add data/items data/published_index.json data/resolved.json \
                  data/health.json content/review longform_script.json \
                  data/shorts_latest.json data/story_material.md || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: $(date -u -d '9 hours' +%Y-%m-%d) 발행 기록"
            # 도는 동안 누가 밀면 푸시가 거부된다. 해설 예약이 매일 밀기
            # 시작하면서 실제로 났다. 여기서 그냥 죽으면 published_index 가
            # 커밋되지 않아 다음날 같은 기사가 다시 나갈 수 있다 —
            # 재발행은 이 신문에서 가장 나쁜 사고다. 그러니 다시 붙여 민다.
            for i in 1 2 3; do
              git push && exit 0
              echo "푸시 거부 — 원격을 받아 다시 얹는다 ($i/3)"
              # --autostash: 파이프라인이 만진 스테이징 안 된 파일(used.json 등)이
              # 있으면 rebase 가 거부된다. 2026-09-09 실측 — 재시도가 여기서 죽어
              # 발행 기록을 못 밀었고, 그날 두 번째 배포가 통째로 건너뛰어졌다.
              # 내용 충돌이 나면(2026-09-09 실측: 푸시 트리거 실행과 수동 실행이
              # 같은 날 기록을 동시에 밀어 health.json 이 충돌) 이 실행의 기록을
              # 택한다. 두 실행 다 같은 자료로 만든 기록이라 잃는 것이 없고,
              # 여기서 죽으면 배포까지 건너뛰어진다.
              if ! git pull --rebase --autostash origin main; then
                conflicted=$(git diff --name-only --diff-filter=U)
                [ -n "$conflicted" ] || exit 1
                echo "충돌 — 이 실행의 기록을 택한다: $conflicted"
                echo "$conflicted" | xargs git checkout --theirs --
                echo "$conflicted" | xargs git add --
                GIT_EDITOR=true git rebase --continue || exit 1
              fi
              sleep 5
            done
            echo "세 번 시도했는데 밀지 못했다." >&2
            exit 1
          fi

      # enablement: true — Pages 사이트가 없으면 만든다.
      # 2026-09-14: 저장소를 잠깐 비공개로 돌렸더니 Pages 사이트가 **삭제**됐고,
      # 공개로 되돌려도 안 살아났다. 이 값이 false 면 "Get Pages site failed" 로
      # 빌드가 죽고 사이트가 통째로 404 가 된다. 켜 두면 스스로 복구한다.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 숏폼을 @waffletrip06 릴스로 올린다.
  #
  # ★반드시 **배포가 끝난 뒤**다. 인스타는 파일을 올려받지 않고
  # waffletrip.com 의 주소를 **직접 받아간다**. 빌드 잡 안에서 올리면 그때는
  # 아직 어제 영상이 서비스되고 있어서, 오늘 캡션에 어제 영상이 붙는다.
  #
  # 시크릿이 없으면 스크립트가 스스로 멈춘다. 발행이 실패해도 신문은 이미
  # 나갔으므로 여기서 잡을 죽이지 않는다.
  publish:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write        # 발행 기록 커밋
    env:
      TZ: Asia/Seoul
    steps:
      # ★ `ref: main` 이 있어야 **그날 빌드가 방금 민 기록**을 본다.
      # 기본 체크아웃은 실행을 띄운 시점의 커밋을 받아오므로, 같은 실행
      # 안에서 빌드가 커밋한 `data/shorts_latest.json` 이 안 보인다.
      # 2026-09-16 실측: 오늘 나레이션판을 만들어 올렸는데 발행기는 어제
      # 무음판을 집었고, 그 주소는 이미 없어서 404 로 멈췄다.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 인스타 발행
        env:
          WAFFLETRIP_IG_USER_ID: ${{ secrets.WAFFLETRIP_IG_USER_ID }}
          WAFFLETRIP_IG_ACCESS_TOKEN: ${{ secrets.WAFFLETRIP_IG_ACCESS_TOKEN }}
        run: python tools/publish_instagram.py --post
        continue-on-error: true

      # 발행 기록을 남겨야 내일 같은 편이 또 안 나간다. 기록이 러너와 함께
      # 사라지면 매일 같은 영상을 올리게 된다 — 재발행은 가장 나쁜 사고다.
      - name: 발행 기록 커밋
        run: |
          git config user.name  "waffletrip-bot"
          git config user.email "bot@waffletrip.com"
          git add data/instagram_posted.json || true
          if git diff --cached --quiet; then
            echo "기록 변경 없음"
          else
            git commit -m "chore: 인스타 발행 기록"
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase --autostash -X theirs origin main || true
            done
          fi
        continue-on-error: true

  # 배포가 끝난 뒤에 알린다. 검색엔진이 바로 받으러 오는데 그때 쪽이 없으면
  # 헛통지가 된다. 통지가 실패해도 신문은 이미 나갔으므로 여기서 멈추지 않는다.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 검색엔진 통지
        continue-on-error: true
        run: python -m src.indexnow
