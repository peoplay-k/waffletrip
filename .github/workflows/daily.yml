name: 매일 발행

on:
  schedule:
    # 08:00 KST = 23:00 UTC (전일). GitHub 스케줄은 UTC 기준이다.
    # GitHub 은 부하가 몰리면 예약 시각보다 수 분에서 수십 분 늦게 띄운다.
    # 정각을 보장하지 않으므로 아침에 확인하는 용도로만 믿는다.
    - cron: '0 23 * * *'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 발행 이력 커밋
  pages: write              # Pages 배포
  id-token: write           # Pages 인증

concurrency:
  group: waffletrip-daily
  cancel-in-progress: false # 발행 중 취소는 이력만 어긋나게 만든다

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트
        run: python -m pytest -q

      - name: 수집
        run: python -m src.collect

      # Google 뉴스 리다이렉트를 실제 기사로 푼다 — 요약·매체명·발행시각.
      # 이게 없으면 기사 페이지가 제목 한 줄짜리 얇은 페이지가 된다.
      # 구글이 방식을 바꿔 실패해도 발행은 계속한다 — 요약 없는 기사는 색인에서 뺀다.
      - name: 원문 해결
        run: python -m src.fetch.resolve
        continue-on-error: true

      # 급상승 키워드. 해설 기사 후보 선정의 세 경로 중 하나라 편집 앞에 둔다.
      # 실패해도 죽지 않는다 — 키워드는 보조 신호다.
      - name: 급상승 키워드
        run: python -m src.trending

      - name: 편집
        run: python -m src.edit

      # 승인된 해설 초안을 내보낸다. edit 가 쓴 오늘자 jsonl 에 이어쓰므로
      # 반드시 편집 뒤, 빌드 앞이어야 한다.
      - name: 해설 발행
        run: python -m src.publish_drafts

      # 2026-09-06 waffletrip.com 연결. 이제 사이트가 도메인 루트에서
      # 서비스되므로 경로 접두사를 주지 않는다(src/render/site.py 기본값).
      - name: 빌드
        run: python -m src.build

      # 조용한 실패를 잡는다. 이상하면 exit 1 로 죽어 Actions 실패 메일이 간다.
      # 빌드 뒤에 두는 이유 — 오늘치 사이트는 일단 내보내고 나서 경보를 울린다.
      - name: 건강검진
        run: python -m src.health

      - name: 발행 이력 커밋
        run: |
          git config user.name  "waffletrip-bot"
          git config user.email "bot@waffletrip.com"
          git add data/items data/published_index.json data/resolved.json content/review || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: $(date -u -d '9 hours' +%Y-%m-%d) 발행 기록"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 배포가 끝난 뒤에 알린다. 검색엔진이 바로 받으러 오는데 그때 쪽이 없으면
  # 헛통지가 된다. 통지가 실패해도 신문은 이미 나갔으므로 여기서 멈추지 않는다.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 검색엔진 통지
        continue-on-error: true
        run: python -m src.indexnow
