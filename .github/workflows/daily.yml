name: 매일 발행

on:
  schedule:
    # 05:00 KST = 20:00 UTC (전일). GitHub 스케줄은 UTC 기준이다.
    - cron: '0 20 * * *'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 발행 이력 커밋
  pages: write              # Pages 배포
  id-token: write           # Pages 인증

concurrency:
  group: waffletrip-daily
  cancel-in-progress: false # 발행 중 취소는 이력만 어긋나게 만든다

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트
        run: python -m pytest -q

      - name: 수집
        run: python -m src.collect

      # 급상승 키워드. 해설 기사 후보 선정의 세 경로 중 하나라 편집 앞에 둔다.
      # 실패해도 죽지 않는다 — 키워드는 보조 신호다.
      - name: 급상승 키워드
        run: python -m src.trending

      - name: 편집
        run: python -m src.edit

      # 승인된 해설 초안을 내보낸다. edit 가 쓴 오늘자 jsonl 에 이어쓰므로
      # 반드시 편집 뒤, 빌드 앞이어야 한다.
      - name: 해설 발행
        run: python -m src.publish_drafts

      # 커스텀 도메인이 붙기 전까지 사이트는 /<repo>/ 하위에서 서비스된다.
      # 접두사를 안 주면 모든 링크가 도메인 루트를 가리켜 통째로 깨진다.
      # DNS 가 붙으면 이 env 를 지운다.
      - name: 빌드
        run: python -m src.build
        env:
          WAFFLE_BASE_PATH: /waffletrip

      # 조용한 실패를 잡는다. 이상하면 exit 1 로 죽어 Actions 실패 메일이 간다.
      # 빌드 뒤에 두는 이유 — 오늘치 사이트는 일단 내보내고 나서 경보를 울린다.
      - name: 건강검진
        run: python -m src.health

      - name: 발행 이력 커밋
        run: |
          git config user.name  "waffletrip-bot"
          git config user.email "bot@waffletrip.com"
          git add data/items data/published_index.json content/review || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: $(date -u -d '9 hours' +%Y-%m-%d) 발행 기록"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
