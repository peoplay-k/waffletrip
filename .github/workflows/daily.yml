name: 매일 발행

on:
  # 승인된 해설 초안이 올라오면 바로 낸다. 예약 시각까지 기다리면 오늘 쓴
  # 해설이 내일 아침에야 실린다. 봇이 GITHUB_TOKEN 으로 미는 커밋은
  # 깃허브가 재실행하지 않으므로 발행 기록 커밋으로 되돌지 않는다.
  push:
    paths:
      - 'content/review/**'
      - 'data/title_ko.json'   # 해설 에이전트가 번역을 밀면 바로 입힌다
  schedule:
    # 08:00 KST = 23:00 UTC (전일). GitHub 스케줄은 UTC 기준이다.
    # GitHub 은 부하가 몰리면 예약 시각보다 수 분에서 수십 분 늦게 띄운다.
    # 정각을 보장하지 않으므로 아침에 확인하는 용도로만 믿는다.
    - cron: '0 23 * * *'
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write           # 발행 이력 커밋
  pages: write              # Pages 배포
  id-token: write           # Pages 인증

concurrency:
  group: waffletrip-daily
  cancel-in-progress: false # 발행 중 취소는 이력만 어긋나게 만든다

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 의존성 설치
        run: pip install -r requirements.txt

      - name: 테스트
        run: python -m pytest -q

      - name: 수집
        run: python -m src.collect

      # Google 뉴스 리다이렉트를 실제 기사로 푼다 — 요약·매체명·발행시각.
      # 이게 없으면 기사 페이지가 제목 한 줄짜리 얇은 페이지가 된다.
      # 구글이 방식을 바꿔 실패해도 발행은 계속한다 — 요약 없는 기사는 색인에서 뺀다.
      - name: 원문 해결
        run: python -m src.fetch.resolve
        continue-on-error: true

      # 급상승 키워드. 해설 기사 후보 선정의 세 경로 중 하나라 편집 앞에 둔다.
      # 실패해도 죽지 않는다 — 키워드는 보조 신호다.
      - name: 급상승 키워드
        run: python -m src.trending

      - name: 편집
        run: python -m src.edit

      # 승인된 해설 초안을 내보낸다. edit 가 쓴 오늘자 jsonl 에 이어쓰므로
      # 반드시 편집 뒤, 빌드 앞이어야 한다.
      - name: 해설 발행
        run: python -m src.publish_drafts

      # 2026-09-06 waffletrip.com 연결. 이제 사이트가 도메인 루트에서
      # 서비스되므로 경로 접두사를 주지 않는다(src/render/site.py 기본값).
      - name: 빌드
        run: python -m src.build

      # 영상 대본과 화면을 매일 만든다. 여기까지가 무료다 — 나레이션은
      # 크레딧이 들어 사람이 보고 결정한다. 화면은 저장소에 넣지 않고
      # 아티팩트로 내린다(하루 1.2MB 씩 쌓으면 저장소가 못 버틴다).
      # 한글 폰트가 없으면 네모만 그려진 화면이 나오므로 먼저 깐다.
      # 영상이 실패해도 신문은 나가야 하므로 여기서 멈추지 않는다.
      - name: 영상 대본·화면
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          python tools/make_longform.py --frames video-frames
          # --frames 만 주면 대본이 public/video/ 로 간다. 거기는
          # gitignore 라 커밋되지 않고 다음 빌드가 지운다. 저장소
          # 루트에 남기려면 --script-only 로 한 번 더 부른다.
          python tools/make_longform.py --script-only
        continue-on-error: true

      - name: 영상 화면 내려받기용
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-frames
          path: video-frames/
          retention-days: 30
          if-no-files-found: ignore

      # 조용한 실패를 잡는다. 이상하면 exit 1 로 죽어 Actions 실패 메일이 간다.
      # 빌드 뒤에 두는 이유 — 오늘치 사이트는 일단 내보내고 나서 경보를 울린다.
      - name: 건강검진
        run: python -m src.health

      - name: 발행 이력 커밋
        run: |
          git config user.name  "waffletrip-bot"
          git config user.email "bot@waffletrip.com"
          # health.json 을 빼면 건강검진이 매일 돌고도 기록이 러너와 함께
          # 사라진다. '3일 연속 발행 0건' 같은 검사는 과거 기록이 있어야
          # 성립하므로, 빠뜨리면 검진 세 개 중 두 개가 꺼진 것과 같다.
          git add data/items data/published_index.json data/resolved.json \
                  data/health.json content/review longform_script.json || true
          if git diff --cached --quiet; then
            echo "변경 없음 — 커밋 생략"
          else
            git commit -m "chore: $(date -u -d '9 hours' +%Y-%m-%d) 발행 기록"
            # 도는 동안 누가 밀면 푸시가 거부된다. 해설 예약이 매일 밀기
            # 시작하면서 실제로 났다. 여기서 그냥 죽으면 published_index 가
            # 커밋되지 않아 다음날 같은 기사가 다시 나갈 수 있다 —
            # 재발행은 이 신문에서 가장 나쁜 사고다. 그러니 다시 붙여 민다.
            for i in 1 2 3; do
              git push && exit 0
              echo "푸시 거부 — 원격을 받아 다시 얹는다 ($i/3)"
              # --autostash: 파이프라인이 만진 스테이징 안 된 파일(used.json 등)이
              # 있으면 rebase 가 거부된다. 2026-09-09 실측 — 재시도가 여기서 죽어
              # 발행 기록을 못 밀었고, 그날 두 번째 배포가 통째로 건너뛰어졌다.
              git pull --rebase --autostash origin main || exit 1
              sleep 5
            done
            echo "세 번 시도했는데 밀지 못했다." >&2
            exit 1
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 배포가 끝난 뒤에 알린다. 검색엔진이 바로 받으러 오는데 그때 쪽이 없으면
  # 헛통지가 된다. 통지가 실패해도 신문은 이미 나갔으므로 여기서 멈추지 않는다.
  notify:
    needs: deploy
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: 의존성 설치
        run: pip install -r requirements.txt
      - name: 검색엔진 통지
        continue-on-error: true
        run: python -m src.indexnow
